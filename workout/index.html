<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jacob's Gym Companion</title>

<style>

* {
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body {
    margin:0;
    background:#f5f5f7;
    color:#1d1d1f;
}


header {
    padding:28px 20px 10px;
}

h1 {
    font-size:32px;
    margin:0;
    letter-spacing:-1px;
}

.subtitle {
    color:#6e6e73;
    margin-top:6px;
}


.days {
    display:flex;
    gap:10px;
    padding:15px;
}


.day {
    flex:1;
    height:50px;
    border:none;
    border-radius:18px;
    background:white;
    font-size:18px;
    font-weight:700;
    color:#555;
}


.day.active {
    background:#1d1d1f;
    color:white;
}


.container {
    padding:0 15px 40px;
}


.card {
    background:white;
    border-radius:22px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}


.card h2 {
    margin:0 0 8px;
    font-size:22px;
}


.small {
    color:#6e6e73;
    font-size:14px;
}


.exercise {
    background:#f5f5f7;
    border-radius:18px;
    padding:16px;
    margin-top:14px;
}


.exercise h3 {
    margin:0;
    font-size:18px;
}


.tag {
    display:inline-block;
    background:#e5e5ea;
    border-radius:20px;
    padding:5px 10px;
    font-size:13px;
    margin-top:8px;
}


button.more {
    margin-top:12px;
    border:none;
    background:#1d1d1f;
    color:white;
    border-radius:20px;
    padding:10px 15px;
    font-weight:600;
}


.details {
    display:none;
    margin-top:15px;
    line-height:1.45;
    font-size:14px;
}


.details b {
    font-size:15px;
}


.tip {
    background:#e9e9eb;
    border-radius:14px;
    padding:12px;
    margin-top:10px;
}


.footer {
    text-align:center;
    padding:20px;
    color:#777;
    font-size:13px;
}


</style>

</head>

<body>


<header>

<h1>Jacob's Gym</h1>

<div class="subtitle">
One Stop Gym Ashford • Strength + Fitness Plan
</div>

</header>


<div class="days">

<button class="day" onclick="showDay(1)">M</button>
<button class="day" onclick="showDay(2)">T</button>
<button class="day" onclick="showDay(3)">W</button>
<button class="day" onclick="showDay(4)">T</button>
<button class="day" onclick="showDay(5)">F</button>

</div>


<div id="content" class="container"></div>


<div class="footer">
Technique first • Progress slowly • Stay consistent
</div>


<script>


const workouts = {


1:{

title:"Monday — Full Body Strength",

warmup:`
<b>Warm up (5 minutes)</b><br><br>

<b>Treadmill:</b><br>
• Start walking for 1 minute<br>
• Increase to a light jog if comfortable<br>
• Keep shoulders relaxed<br>
• Do not hold the rails unless needed<br><br>

Purpose:<br>
Raise your heart rate and prepare your muscles before lifting.
`,

exercises:[


{
name:"Goblet Squat",
sets:"3 sets × 10 reps",

details:`
<b>Setup:</b><br>
1. Choose a dumbbell you can control.<br>
2. Hold it vertically against your chest.<br>
3. Feet slightly wider than shoulder width.<br><br>

<b>Movement:</b><br>
1. Push hips backwards.<br>
2. Lower slowly.<br>
3. Keep chest up.<br>
4. Push through heels to stand.<br><br>

<b>Works:</b><br>
Legs, glutes, core.<br><br>

<b>Common mistakes:</b><br>
❌ Knees collapsing inward<br>
❌ Rushing the movement
`
},


{
name:"Dumbbell Chest Press",
sets:"3 sets × 10 reps",

details:`
<b>Setup:</b><br>
1. Set bench flat.<br>
2. Sit with dumbbells on thighs.<br>
3. Carefully lie back.<br>
4. Bring dumbbells beside your chest.<br><br>

<b>Movement:</b><br>
1. Push upwards until arms are nearly straight.<br>
2. Lower slowly until chest level.<br><br>

<b>Safety:</b><br>
Do not drop weights.
`
},


{
name:"Weighted Lat Pulldown",
sets:"3 sets × 10 reps",

details:`
<b>Machine Setup:</b><br>
1. Adjust the seat height.<br>
2. Place knees firmly under the pads.<br>
3. Select your weight using the pin.<br>
4. Grip the bar slightly wider than shoulders.<br><br>

<b>Movement:</b><br>
1. Sit tall.<br>
2. Pull the bar towards your upper chest.<br>
3. Squeeze your back muscles.<br>
4. Slowly return the bar.<br><br>

<b>Avoid:</b><br>
❌ Leaning backwards<br>
❌ Pulling behind your neck<br>
`
},


{
name:"Hip Thrust Machine",
sets:"3 sets × 12 reps",

details:`
<b>Setup:</b><br>
1. Adjust the back pad so shoulders are supported.<br>
2. Place feet flat on platform.<br>
3. Position the pad across your hips.<br><br>

<b>Movement:</b><br>
1. Push through heels.<br>
2. Lift hips upwards.<br>
3. Pause and squeeze at the top.<br>
4. Lower slowly.<br><br>

<b>Works:</b><br>
Glutes, legs and core.
`
},


{
name:"Air Bike Finisher",
sets:"5 minutes",

details:`
<b>Setup:</b><br>
1. Adjust seat so knee is slightly bent at bottom position.<br><br>

<b>Workout:</b><br>
30 seconds hard effort<br>
30 seconds easy effort<br>
Repeat.<br><br>

Keep control. Do not sprint so hard that your technique disappears.
`
}

]

},
,

2:{

title:"Tuesday — Upper Body + Rowing",

warmup:`
<b>Warm up (5 minutes)</b><br><br>

<b>Water Rower:</b><br>
• Strap your feet in securely<br>
• Start at an easy pace<br>
• Focus on smooth movements<br>
• Increase speed slightly near the end<br><br>

<b>Rowing technique:</b><br>
Legs → Body → Arms<br>
Return Arms → Body → Legs
<br><br>

Purpose:<br>
Prepare your back, shoulders and arms.
`,

exercises:[


{
name:"Water Rower",
sets:"5 minute warm up + intervals",

details:`
<b>Setup:</b><br>
1. Adjust foot straps so your feet are secure.<br>
2. Sit tall with your back straight.<br>
3. Hold the handle lightly.<br><br>

<b>Correct movement:</b><br>
1. Push with your legs first.<br>
2. Lean back slightly.<br>
3. Pull handle towards your ribs.<br>
4. Return slowly.<br><br>

<b>Avoid:</b><br>
❌ Pulling only with arms<br>
❌ Rounding your back
`
},


{
name:"Dumbbell Shoulder Press",
sets:"3 sets × 10 reps",

details:`
<b>Setup:</b><br>
1. Sit upright on a bench.<br>
2. Hold dumbbells at shoulder height.<br>
3. Keep feet planted firmly.<br><br>

<b>Movement:</b><br>
1. Press dumbbells upwards.<br>
2. Stop before locking elbows.<br>
3. Lower slowly.<br><br>

<b>Works:</b><br>
Shoulders and upper body.
`
},


{
name:"Lat Pulldown",
sets:"3 sets × 10 reps",

details:`
<b>Machine setup:</b><br>
1. Sit in the machine.<br>
2. Adjust knee pads until legs are secure.<br>
3. Select a suitable weight.<br>
4. Grip bar wider than shoulders.<br><br>

<b>Movement:</b><br>
Pull down towards your chest.<br>
Slowly control the return.<br><br>

Think:<br>
"Pull with your back, not just your arms."
`
},


{
name:"Dumbbell Bicep Curl",
sets:"3 sets × 12 reps",

details:`
<b>Setup:</b><br>
1. Stand tall.<br>
2. Hold dumbbells beside your body.<br>
3. Keep elbows close to your sides.<br><br>

<b>Movement:</b><br>
1. Curl dumbbells upwards.<br>
2. Squeeze at the top.<br>
3. Lower slowly.<br><br>

Avoid swinging your body.
`
},


{
name:"Dumbbell Tricep Extension",
sets:"3 sets × 12 reps",

details:`
<b>Setup:</b><br>
1. Hold one dumbbell above your head.<br>
2. Keep elbows pointing forwards.<br><br>

<b>Movement:</b><br>
1. Lower dumbbell behind your head.<br>
2. Extend arms upwards.<br><br>

Works:<br>
Back of arms.
`
}

]

},



3:{

title:"Wednesday — Legs + Core",

warmup:`
<b>Warm up (5 minutes)</b><br><br>

<b>Stationary Bike:</b><br>
• Comfortable pace for 3 minutes<br>
• Slightly increase effort for final 2 minutes<br><br>

Purpose:<br>
Prepare legs and joints before heavier movements.
`,

exercises:[


{
name:"Weighted Leg Machine",
sets:"3 sets × 10 reps",

details:`
<b>Setup:</b><br>
1. Adjust seat position.<br>
2. Place feet correctly on pads/platform.<br>
3. Select weight pin.<br>
4. Make sure movement feels comfortable.<br><br>

<b>Movement:</b><br>
Push smoothly.<br>
Do not slam the weights down.<br><br>

<b>Safety:</b><br>
Use a lighter weight until you understand the machine.
`
},


{
name:"Hip Thrust Machine",
sets:"3 sets × 12 reps",

details:`
<b>Setup:</b><br>
1. Adjust shoulder support.<br>
2. Place feet shoulder-width apart.<br>
3. Secure the hip pad.<br><br>

<b>Movement:</b><br>
Drive hips upwards.<br>
Pause at the top.<br>
Lower under control.<br><br>

Focus on squeezing your glutes.
`
},


{
name:"Dumbbell Lunges",
sets:"3 sets × 10 each leg",

details:`
<b>Setup:</b><br>
1. Hold dumbbells at your sides.<br>
2. Stand tall.<br><br>

<b>Movement:</b><br>
1. Step forward.<br>
2. Lower your back knee towards the floor.<br>
3. Push back up.<br><br>

Keep your front knee controlled.
`
},


{
name:"Sled Push",
sets:"6 pushes",

details:`
<b>Setup:</b><br>
1. Add a manageable weight.<br>
2. Hold handles firmly.<br>
3. Lean slightly forward.<br><br>

<b>Movement:</b><br>
Push using your legs.<br>
Take controlled steps.<br><br>

Works:<br>
Leg power and fitness.
`
},


{
name:"Core Ball Exercises",
sets:"3 rounds",

details:`
<b>Round:</b><br>
• 20 second plank<br>
• 15 sit ups<br>
• 20 Russian twists<br><br>

Keep movements controlled.<br>
Core training helps stability and posture.
`
}

]

},
,

4:{

title:"Thursday — Upper Body + Cardio",

warmup:`
<b>Warm up (5 minutes)</b><br><br>

<b>Treadmill incline walk:</b><br>
• Start with a comfortable walking speed<br>
• Add a small incline if comfortable<br>
• Keep posture tall<br><br>

Purpose:<br>
Increase body temperature and prepare shoulders/chest.
`,

exercises:[

{
name:"Dumbbell Chest Press",
sets:"3 sets × 10 reps",

details:`
<b>Setup:</b><br>
1. Place bench flat.<br>
2. Select suitable dumbbells.<br>
3. Sit and bring weights to chest position.<br><br>

<b>Movement:</b><br>
Push upwards smoothly.<br>
Lower slowly.<br><br>

Focus on control, not maximum weight.
`
},


{
name:"Lat Pulldown",
sets:"3 sets × 10 reps",

details:`
<b>Setup:</b><br>
1. Adjust seat height.<br>
2. Lock legs under pads.<br>
3. Select weight.<br>
4. Grip bar evenly.<br><br>

<b>Movement:</b><br>
Pull towards upper chest.<br>
Slowly return.<br><br>

Keep chest lifted.
`
},


{
name:"Dumbbell Row",
sets:"3 sets × 10 each side",

details:`
<b>Setup:</b><br>
1. Place one hand and knee on bench.<br>
2. Hold dumbbell with other hand.<br>
3. Keep back flat.<br><br>

<b>Movement:</b><br>
Pull dumbbell towards ribs.<br>
Lower slowly.<br><br>

Works your back muscles.
`
},


{
name:"Dumbbell Lateral Raise",
sets:"3 sets × 12 reps",

details:`
<b>Setup:</b><br>
1. Stand tall holding light dumbbells.<br>
2. Keep arms relaxed.<br><br>

<b>Movement:</b><br>
Raise arms sideways until shoulder height.<br>
Lower slowly.<br><br>

Use lighter weights — this exercise is about control.
`
},


{
name:"Air Bike Intervals",
sets:"10 minutes",

details:`
<b>Setup:</b><br>
1. Adjust seat height.<br>
2. Make sure you can fully push pedals comfortably.<br><br>

<b>Intervals:</b><br>
20 seconds hard effort<br>
40 seconds recovery<br><br>

Repeat until finished.
`
}

]

},



5:{

title:"Friday — Full Body Circuit",

warmup:`
<b>Warm up:</b><br><br>

Choose one:<br>
• Water rower 5 minutes<br>
• Bike 5 minutes<br>
• Treadmill 5 minutes<br><br>

Start easy. Save energy for the circuit.
`,

exercises:[


{
name:"Water Rower",
sets:"2 minutes",

details:`
Row at a strong but controlled pace.<br><br>

Remember:<br>
Legs first → body → arms.
`
},


{
name:"Dumbbell Squats",
sets:"12 reps",

details:`
Hold dumbbell safely.<br>
Keep chest up.<br>
Squat under control.<br>
Push through heels.
`
},


{
name:"Dumbbell Press",
sets:"10 reps",

details:`
Use a comfortable weight.<br>
Keep wrists straight.<br>
Lower slowly.
`
},


{
name:"Lat Pulldown",
sets:"10 reps",

details:`
Use normal machine setup.<br>
Pull bar towards chest.<br>
Control the return.
`
},


{
name:"Sled Push",
sets:"1 length",

details:`
Choose a safe weight.<br>
Lean forward slightly.<br>
Drive through your legs.<br>
Keep back straight.
`
}

]

}

};



function showDay(day){

let workout=workouts[day];

let html=`


<div class="card">

<h2>${workout.title}</h2>

<div class="small">

⏱ 55 minute session<br>
💪 Rest 60-90 seconds between sets

</div>

</div>


<div class="card">

${workout.warmup}

</div>

`;


workout.exercises.forEach((exercise,index)=>{


html += `

<div class="exercise">

<h3>
${index+1}. ${exercise.name}
</h3>


<div class="tag">
${exercise.sets}
</div>


<button class="more" onclick="toggle(${index})">
Show setup & tips
</button>


<div class="details" id="detail${index}">

${exercise.details}

<div class="tip">

<b>Remember:</b><br>
Good form beats heavy weight.
If something hurts sharply, stop.

</div>

</div>


</div>


`;

});


document.getElementById("content").innerHTML=html;


document.querySelectorAll(".day").forEach((button,index)=>{

button.classList.toggle(
"active",
index+1===day
);

});

}



function toggle(number){

let item=document.getElementById(
"detail"+number
);

if(item.style.display==="block"){
item.style.display="none";
}
else{
item.style.display="block";
}

}



// Automatically open current day

let today=new Date().getDay();

let selectedDay;


if(today===1){
selectedDay=1;
}
else if(today===2){
selectedDay=2;
}
else if(today===3){
selectedDay=3;
}
else if(today===4){
selectedDay=4;
}
else if(today===5){
selectedDay=5;
}
else{

// Weekend: open Monday
selectedDay=1;

}


showDay(selectedDay);


</script>


</body>

</html>
